services:
  django:
    build:
      context: .
      cache_from:
        - python:3.10-slim
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./core:/app/core
      - ./users:/app/users
      - ./vibe_scraper:/app/vibe_scraper
      - ./templates:/app/templates
      - ./static:/app/static
    restart: unless-stopped
    networks:
      - supabase_default
    external_links:
      - supabase_kong_vibe-code-ig-scraper-saas:supabase
      - supabase_db_vibe-code-ig-scraper-saas:db

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - supabase_default
    external_links:
      - supabase_kong_vibe-code-ig-scraper-saas:supabase
      - supabase_db_vibe-code-ig-scraper-saas:db

# ——— Extraction Agent (final version) ———
  extraction-agent:
    build:
      context: ./extraction_agent
      dockerfile: Dockerfile
    ports:
      - "8001:8000"                  # host → container
    env_file:
      - .env                         # picks up OPENROUTER_API_KEY + EXTRACTION_AGENT_API_KEY
    restart: unless-stopped
    networks:
      - supabase_default
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    driver: bridge
  supabase_default:
    external: true

volumes:
  n8n_data: